services:
  frontend:
    image: wofa/m2c-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    deploy:
      replicas: 2
    networks:
      - fleet-network

  db:
    image: postgres:15
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=metal_to_cloud
      - POSTGRES_USER=robot_admin
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    volumes:
      - type: bind
        source: /mnt/volume_tor1_02/pg_data
        target: /var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - fleet-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U robot_admin -d metal_to_cloud"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == m2c-droplet2

  api:
    image: wofa/m2c-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      - db
    ports:
      - "8000:8000"
    secrets:
      - postgres_password
    env_file:
      - .env
    networks:
      - fleet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == m2c-droplet1

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - fleet-network
    deploy:
      placement:
        constraints:
          - node.hostname == m2c-droplet1

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - fleet-network
    deploy:
      placement:
        constraints:
          - node.hostname == m2c-droplet1

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - fleet-network
    deploy:
      placement:
        constraints:
          - node.hostname == m2c-droplet1

volumes:
  pg_data:
  grafana_data:

networks:
  fleet-network:
    driver: overlay

secrets:
  postgres_password:
    external: true